<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "nav">

       <div id ="name"> 
        <img src = "logo Travelmate.jpg" height="55 ">
         
        <a href="#" class="logo">
          TravelMate</a>
       
     
      </div>
     
     
      <a href="index.html">Home</a>
       
      <a href="tours.html">Tours</a>
      <a href="About.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="form.html" class="book-btn">Book Now</a>
       <div class="search-box">
        <input type="text" placeholder="Enter locations">
        <button>Search</button>
    </div>
    
    </div>
    <div class="page-header">
        <h1 class="header-title">Get in Touch</h1>
        <p>We'd love to hear about your travel experience!</p>
    </div>

    <div class="content-area">
        
        <div class="section-header">
            <h2>Our Tech Team</h2>
        </div>

        <div class="info-grid">
            <div class="info-block">
                <span class="info-title">Primary Support</span>
                <span class="info-detail">+91 123456789</span>
                <div style="margin-top:5px; font-size: 0.7rem;">9:00 AM - 6:00 PM</div>
            </div>
            <div class="info-block">
                <span class="info-title">Urgent Tech</span>
                <span class="info-detail">+91 987654321</span>
                <div style="margin-top:5px; font-size: 0.7rem;">Available 24/7</div>
            </div>
        </div>

        <div class="section-header">
            <h2>Share Your Feedback</h2>
        </div>

        <div class="feedback-container">
            <form action="#">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Your Message</label>
                    <textarea placeholder="Tell us about your trip or report a bug..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Feedback</button>
            </form>
        </div>

    </div>

    <div class="page-footer">
        &copy; 2026 TravelMate — Made with <span style="color:#C97241">🧡</span> for explorers everywhere.
    </div>
     
</body>
</html>
